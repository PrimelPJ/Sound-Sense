
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundSense</title>

<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #5f5e5a;
    --line: #dcdad2;
    --red: #b42318;
    --red-bg: #fde8e6;
    --amber: #8a4b00;
    --amber-bg: #fdf0d5;
    --green: #1f6f3a;
    --green-bg: #e3f4e8;
    --blue: #1d4ed8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --card: #201f1d;
      --text: #f1efe8;
      --muted: #b4b2a9;
      --line: #3a3936;
      --red: #ff8a80;
      --red-bg: #3b1714;
      --amber: #ffc46b;
      --amber-bg: #3a2a0c;
      --green: #7ee2a0;
      --green-bg: #11301c;
      --blue: #8ab4ff;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.5;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }

  h1 {
    margin: 0;
    font-size: 22px;
  }

  h2 {
    margin: 0 0 12px;
    font-size: 18px;
  }

  .sub {
    color: var(--muted);
    font-size: 15px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    display: grid;
    gap: 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }

  .grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 18px;
  }

  @media (max-width: 800px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
</body>
</html>
